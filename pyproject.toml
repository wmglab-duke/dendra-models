[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name (what you "pip install"). Can be hyphenated; import remains `dendra_models`.
name = "dendra-models"
dynamic = ["version"]
description = "Models for Dendra"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Duke-Research-NonCommercial AND CC-BY-NC-SA-4.0"
license-files = [
  "LICENSE.md",
  "LICENSES/CC-BY-NC-SA-4.0.txt",
  "THIRD_PARTY_NOTICES.md",
]
authors = [{ name = "Minhaj Hussain", email = "minhaj.hussain@duke.edu" }]
dependencies = [
  "dendra[solvers]>=0.27.0",
]

keywords = ["neuroscience", "models", "dendra"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://wmglab-duke.github.io/dendra/"
Repository = "https://github.com/wmglab-duke/dendra-models"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools]
# Tell setuptools that packages live under src/
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = {attr = "dendra_models.__version__"}

[tool.setuptools.packages.find]
# Find packages only under src, and include your package namespace
where = ["src"]
include = ["dendra_models*"]
exclude = ["dendra_models.models.networks.zhang_2014.tests*"]

[tool.setuptools.package-data]
# patterns are relative to the *package root* (`src/dendra_models`)
dendra_models = [
  "models/**/*.pt",
  "models/**/*.gml",
  "models/**/*.md",
]

[tool.pytest.ini_options]
filterwarnings = [
  "error:Mechanism[.]ASSIGNED.*:DeprecationWarning",
]
