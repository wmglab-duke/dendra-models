[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name (what you "pip install"). Can be hyphenated; import remains `axonml_models`.
name = "axonml-models"
version = "0.1.0"
description = "Models for AxonML"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Your Name", email = "you@example.com" }]
dependencies = [
  "axonml"
]

# Optional but nice-to-have
keywords = ["neuroscience", "models", "axonml"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[tool.setuptools]
# Tell setuptools that packages live under src/
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
# Find packages only under src, and include your package namespace
where = ["src"]
include = ["axonml_models*"]

[tool.setuptools.package-data]
# patterns are relative to the *package root* (`src/axonml_models`)
axonml_models = [
  "models/**/*.pt",
  "models/**/*.gml"
]